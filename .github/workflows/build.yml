name: Build ImmortalWrt 23.05.7 JDCloud RE-SP-01B

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: v23.05.7
  REPO_COMMIT: 1db8d96e4866
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone $REPO_URL openwrt
          cd openwrt
          git checkout $REPO_COMMIT
          cd ..

      - name: Load feeds & config
        run: |
          cp $FEEDS_CONF openwrt/feeds.conf.default
          cp $CONFIG_FILE openwrt/.config
          cp $DIY_P1_SH openwrt/diy-part1.sh
          cp $DIY_P2_SH openwrt/diy-part2.sh
          chmod +x openwrt/diy*.sh
          cd openwrt
          ./diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./diy-part2.sh

      - name: Download package
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt-Firmware
          path: openwrt/bin/targets/ramips/mt7621/

      - name: Upload to Release
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: softprops/action-gh-release@master
        with:
          tag_name: "ImmortalWrt-23.05.7-JDCloud-RE-SP-01B"
          files: openwrt/bin/targets/ramips/mt7621/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
